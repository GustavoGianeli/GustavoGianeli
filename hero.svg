<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-labelledby="title desc">
<title id="title">Gustavo Gianeli | By: The Seventh</title>
<desc id="desc">Perfil pessoal de Gustavo Gianeli, com foto, nome e codinome alternando em animação, sobre gradiente azul para roxo.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B4BA8"/>
    <stop offset=".52" stop-color="#283A9B"/>
    <stop offset="1" stop-color="#54218F"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#67E8F9"/>
    <stop offset=".52" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#D8B4FE"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#67E8F9"/>
    <stop offset=".55" stop-color="#A5B4FC"/>
    <stop offset="1" stop-color="#E9D5FF"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#070B20" flood-opacity=".38"/>
  </filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.15" fill="#E0E7FF" fill-opacity=".14"/>
  </pattern>
  <clipPath id="card"><rect width="1100" height="340" rx="30"/></clipPath>
  <clipPath id="avatar"><circle cx="135" cy="163" r="66"/></clipPath>
</defs>
<style>
  .sans{font-family:Inter,'Segoe UI','Noto Sans',Ubuntu,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace}
  .drift-a{animation:driftA 16s ease-in-out infinite alternate}
  .drift-b{animation:driftB 19s ease-in-out infinite alternate}
  .ring-spin{transform-origin:135px 163px;animation:ringSpin 18s linear infinite}
  .name-gustavo{opacity:1;animation:showGustavo 8s ease-in-out infinite}
  .name-seventh{opacity:0;animation:showSeventh 8s ease-in-out infinite}
  .cursor{animation:blink 1s steps(1) infinite}
  .pill-pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes driftA{to{transform:translate(85px,32px)}}
  @keyframes driftB{to{transform:translate(-75px,-30px)}}
  @keyframes ringSpin{to{transform:rotate(360deg)}}
  @keyframes showGustavo{0%,43%{opacity:1;transform:translateY(0)}50%,93%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes showSeventh{0%,43%{opacity:0;transform:translateY(9px)}50%,93%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(9px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{50%{opacity:.48}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.name-seventh{display:none!important}.name-gustavo{opacity:1!important}}
</style>

<g clip-path="url(#card)">
  <rect width="1100" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".6">
    <circle class="drift-a" cx="185" cy="40" r="150" fill="#38BDF8" fill-opacity=".7"/>
    <circle class="drift-b" cx="900" cy="320" r="190" fill="#A855F7" fill-opacity=".72"/>
    <circle cx="570" cy="45" r="130" fill="#6366F1" fill-opacity=".4"/>
  </g>
  <rect width="1100" height="340" fill="url(#dots)"/>
</g>
<rect x=".7" y=".7" width="1098.6" height="338.6" rx="29.3" fill="none" stroke="#DBEAFE" stroke-opacity=".27"/>

<!-- Profile photo -->
<g filter="url(#shadow)">
  <circle cx="135" cy="163" r="75" fill="#101A42" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="135" cy="163" r="66" fill="#172554"/>
  <text x="135" y="174" text-anchor="middle" class="sans" font-size="30" font-weight="800" fill="#C7D2FE">GG</text>
  <image x="69" y="97" width="132" height="132" href="https://avatars.githubusercontent.com/u/252503659?v=4" xlink:href="https://avatars.githubusercontent.com/u/252503659?v=4" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)"/>
  <circle class="ring-spin" cx="135" cy="163" r="83" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="90 430" stroke-linecap="round"/>
</g>

<!-- Name and codename alternate in the same heading position -->
<g class="sans">
